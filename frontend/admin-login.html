<!DOCTYPE html>
<html>
<head>
  <title>Admin Login</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #6a11cb, #2575fc);
      background: url("mv4.jpeg") no-repeat center fixed;
            background-size: cover;
    }

    .main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    .card {
      display: flex;
      width: 800px;
      max-width: 95%;
      border-radius: 20px;
      overflow: hidden;
      background: white;
      box-shadow: 0 0 25px rgba(0,0,0,0.3);
    }

    .left {
      width: 50%;
      padding: 40px;
    }

    .left h2 {
      margin-bottom: 5px;
    }

    .left p {
      margin-bottom: 25px;
      color: gray;
    }

    .input-box {
      margin-bottom: 15px;
    }

    .input-box input {
      width: 100%;
      padding: 12px;
      border-radius: 25px;
      border: 1px solid #ccc;
      outline: none;
      font-size: 14px;
    }

    .remember {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      margin-bottom: 20px;
    }

    .remember a {
      text-decoration: none;
      color: #6a11cb;
      font-weight: bold;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border-radius: 25px;
      border: none;
      cursor: pointer;
      background: linear-gradient(135deg, #6a11cb, #2575fc);
      color: white;
      font-size: 15px;
      transition: 0.3s;
    }

    .btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 12px #6a11cb;
    }

    .left .msg {
      margin-top: 10px;
      font-weight: bold;
      text-align: center;
      color: red;
    }

    .right {
      width: 50%;
      background: linear-gradient(135deg, #7f00ff, #e100ff);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px;
            
    }        

    .right h2 {
      font-size: 28px;
      
    }

    .right p {
      margin-top: 15px;
      line-height: 22px;
      
    }

    /* ✅ FOOTER */
    footer {
      width: 100%;
      text-align: center;
      padding: 12px;
      font-size: 14px;
      color: white;
      background: rgba(0,0,0,0.2);
      letter-spacing: 1px;
    }

    footer span {
      color: #00e6ff;
      font-weight: bold;
    }

    /* ✅ Mobile Responsive */
    @media (max-width: 768px) {
      .card {
        flex-direction: column;
      }
      .left, .right {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <div class="main">
    <div class="card">

      <!-- LEFT LOGIN FORM -->
      <div class="left">
        <h2>Hello Admin!</h2>
        <p>Sign in to your admin account</p>

        <div class="input-box">
          <input id="email" placeholder="Admin Email">
        </div>

        <div class="input-box">
          <input id="password" type="password" placeholder="Password">
        </div>

        <div class="remember">
          <span>✔ Secure Login</span>
          <a href="#">Forgot password?</a>
        </div>

        <button class="btn" onclick="adminLogin()">SIGN IN</button>

        <div id="msg" class="msg"></div>
      </div>

      <!-- RIGHT DESIGN PANEL -->
      <div class="right">
        <div>
          <h2>Welcome Back!</h2>
          <p>
            Admin Panel Access <br>
            Secure Notes Approval System <br><br>
            Only authorized administrators can proceed.
          </p>
        </div>
      </div>

    </div>
  </div>

  <!-- ✅ FOOTER -->
  <footer>
    Designed by <span>Ramesh D</span> | © 2025 Notes Sharing Project
  </footer>

  <script>
    async function adminLogin() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      const msg = document.getElementById("msg");

      if (!email || !password) {
        msg.style.color = "orange";
        msg.innerText = "Please enter admin email and password.";
        return;
      }

      try {
        const res = await fetch("/api/admin/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();
        msg.innerText = data.message;
        msg.style.color = data.success ? "green" : "red";

        if (data.success) {
          localStorage.setItem("adminToken", data.token);
          setTimeout(() => {
            location.href = "admin-pending.html";
          }, 1200);
        }

      } catch (err) {
        msg.style.color = "red";
        msg.innerText = "Server error";
      }
    }
  </script>

</body>
</html>
