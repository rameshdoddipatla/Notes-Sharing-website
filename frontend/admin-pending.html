<!DOCTYPE html>
<html>
<head>
  <title>Admin - Pending Notes</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      background: linear-gradient(135deg, #6a11cb, #2575fc);
      color: white;
      background: url("mv4.jpeg") no-repeat center fixed;
            background-size: cover;
    }

    .main {
      flex: 1;
      padding: 30px 15px;
      max-width: 900px;
      margin: auto;
      width: 100%;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .top-bar h2 {
      margin: 0;
      letter-spacing: 1px;
    }

    .logout-btn {
      padding: 10px 20px;
      border-radius: 25px;
      border: none;
      cursor: pointer;
      background: linear-gradient(135deg, #ff4b2b, #ff416c);
      color: white;
      font-size: 14px;
      transition: 0.3s;
    }

    .logout-btn:hover {
      box-shadow: 0 0 12px #ff416c;
      transform: scale(1.05);
    }

    .note {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      padding: 20px;
      margin-bottom: 18px;
      border-radius: 18px;
      box-shadow: 0 0 18px rgba(0,0,0,0.3);
    }

    .note h3 {
      margin: 0 0 8px;
    }

    .note p {
      margin: 0 0 15px;
      color: #e0e0ff;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .btn {
      padding: 10px 18px;
      border-radius: 25px;
      border: none;
      cursor: pointer;
      color: white;
      font-size: 13px;
      transition: 0.3s;
    }

    .view-btn {
      background: linear-gradient(135deg, #00c6ff, #0072ff);
    }

    .view-btn:hover {
      box-shadow: 0 0 10px #00c6ff;
    }

    .approve-btn {
      background: linear-gradient(135deg, #28a745, #1e7e34);
    }

    .approve-btn:hover {
      box-shadow: 0 0 10px #28a745;
    }

    .reject-btn {
      background: linear-gradient(135deg, #dc3545, #a71d2a);
    }

    .reject-btn:hover {
      box-shadow: 0 0 10px #dc3545;
    }

    .empty {
      text-align: center;
      margin-top: 50px;
      font-size: 18px;
      opacity: 0.8;
    }

    /* ✅ FOOTER */
    footer {
      text-align: center;
      padding: 12px;
      font-size: 14px;
      background: rgba(0,0,0,0.25);
    }

    footer span {
      color: #00e6ff;
      font-weight: bold;
    }

    /* ✅ Mobile Responsive */
    @media (max-width: 600px) {
      .actions {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>

  <div class="main">

    <div class="top-bar">
      <h2>Admin - Pending Notes</h2>
      <button class="logout-btn" onclick="adminLogout()">Logout</button>
    </div>

    <div id="pending"></div>
  </div>

  <!-- ✅ FOOTER -->
  <footer>
    Designed by <span>Ramesh D</span> | © 2025 Notes Sharing Project
  </footer>

  <script>
    // ✅ ADMIN PROTECTION
    if (!localStorage.getItem("adminToken")) {
      alert("Admin Login Required!");
      window.location.href = "admin-login.html";
    }

    const API = "";

    // ✅ LOAD PENDING NOTES
    async function loadPending() {
      const res = await fetch(API + "/api/admin/pending");
      const notes = await res.json();
      showPending(notes);
    }

    function showPending(notes) {
      const container = document.getElementById("pending");
      container.innerHTML = "";

      if (notes.length === 0) {
        container.innerHTML = "<div class='empty'>✅ No pending notes.</div>";
        return;
      }

      notes.forEach(note => {
        container.innerHTML += `
          <div class="note">
            <h3>${note.title}</h3>
            <p><b>Uploaded By:</b> ${note.uploadedBy || "Unknown"}</p>

            <div class="actions">
              <a href="${API}${note.filepath}" target="_blank">
                <button class="btn view-btn">View File</button>
              </a>

              <button class="btn approve-btn" onclick="approveNote('${note.id}')">Approve</button>
              <button class="btn reject-btn" onclick="rejectNote('${note.id}')">Reject</button>
            </div>
          </div>
        `;
      });
    }

    async function approveNote(id) {
      if (!confirm("Approve this note?")) return;
      await fetch(API + "/api/admin/approve/" + id, { method: "PUT" });
      loadPending();
    }

    async function rejectNote(id) {
      if (!confirm("Reject this note?")) return;
      await fetch(API + "/api/admin/reject/" + id, { method: "PUT" });
      loadPending();
    }

    function adminLogout() {
      localStorage.removeItem("adminToken");
      location.href = "admin-login.html";
    }

    loadPending();
  </script>

</body>
</html>
