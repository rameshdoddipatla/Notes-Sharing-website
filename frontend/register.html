<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register – Notes Sharing</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      font-family: Arial, sans-serif;

      background: linear-gradient(135deg, #1e3c72, #2a5298, #ff4b8b);
      background-size: 400% 400%;
      animation: gradientMove 8s ease infinite;
       background: url("mv4.jpeg") no-repeat center fixed;
            background-size: cover;
    }

    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .box {
      width: 380px;
      padding: 30px;
      border-radius: 15px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      box-shadow: 0 0 25px rgba(0,0,0,0.3);
      color: white;
      text-align: center;
    }

    h2 {
      margin-bottom: 20px;
      letter-spacing: 1px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
      border: none;
      outline: none;
      font-size: 15px;
    }

    input::placeholder {
      color: #777;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      border: none;
      border-radius: 25px;
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 15px #00c6ff;
    }

    a {
      color: #00e6ff;
      text-decoration: none;
      font-weight: bold;
    }

    a:hover {
      text-decoration: underline;
    }

    #msg {
      margin-top: 10px;
      font-weight: bold;
    }

    /* ✅ FOOTER STYLE */
    footer {
      text-align: center;
      padding: 12px;
      font-size: 14px;
      color: #fff;
      background: rgba(0,0,0,0.25);
      letter-spacing: 1px;
    }

    footer span {
      color: #00e6ff;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="main">
    <div class="box">
      <h2>Register</h2>

      <input id="name" placeholder="Full Name">
      <input id="email" placeholder="Email">
      <input id="password" type="password" placeholder="Password">

      <button onclick="registerUser()">Register</button>

      <p style="margin-top:15px;">
        Already registered? <a href="login.html">Login here</a>
      </p>

      <p id="msg"></p>
    </div>
  </div>

  <!-- ✅ FOOTER -->
  <footer>
    Designed by <span>Ramesh D</span> | © 2025 Notes Sharing Project
  </footer>

  <script>
    const API = "";

    async function registerUser() {
      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      const msg = document.getElementById("msg");

      if (!name || !email || !password) {
        msg.style.color = "orange";
        msg.innerText = "Please fill all fields.";
        return;
      }

      try {
        const res = await fetch(API + "/api/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, email, password })
        });

        const data = await res.json();
        msg.style.color = data.success ? "lightgreen" : "red";
        msg.innerText = data.message || "Registration failed";

        if (data.success) {
          setTimeout(() => {
            window.location.href = "login.html";
          }, 1500);
        }
      } catch (err) {
        msg.style.color = "red";
        msg.innerText = "Server error";
      }
    }
  </script>

</body>
</html>
